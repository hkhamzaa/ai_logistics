version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics_dev
      POSTGRES_DB: logistics_os
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U logistics -d logistics_os']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
